# Two containers:
#   kafka -> a single Kafka broker in KRaft mode (no Zookeeper)
#   spark -> a PySpark 3.5 environment that runs all our Spark jobs
#
# Start:  docker compose up -d --build
# Stop:   docker compose down
#
# Kafka keeps its data inside the container, so `docker compose down` wipes the
# topic. That is fine here: the producer can always replay the CSV again.

services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "9092:9092"   # for programs on your laptop (the producer)
    environment:
      # --- KRaft: this one node is both the broker and the controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Two listeners, because clients reach Kafka from two places ---
      # INTERNAL: other containers (Spark) connect to kafka:29092
      # EXTERNAL: your laptop connects to localhost:9092
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single-broker settings (internal topics cannot have 3 replicas) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # We create our topic explicitly, so typos don't silently create new ones
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # Keep the broker small on a laptop
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  spark:
    build: ./spark
    image: aq-spark:3.5.9
    container_name: spark
    # Running as root avoids file-permission problems on the bind-mounted repo
    user: root
    # Keep the container alive; we run jobs with `docker compose exec spark spark-submit ...`
    command: ["sleep", "infinity"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      CHECKPOINT_DIR: /checkpoints
      PYTHONUNBUFFERED: "1"        # show our print() lines immediately in the terminal
    volumes:
      - ./:/app                    # the whole project, so jobs read data/ and write output/
      - ivy-cache:/root/.ivy2      # caches the Kafka/Delta jars so they download only once
      - spark-checkpoints:/checkpoints   # streaming checkpoints (fast Linux disk, not the bind mount)
    ports:
      - "4040:4040"   # Spark UI of the first running job
      - "4041:4041"   # ...second job (e.g. batch while streaming runs)
      - "4042:4042"

volumes:
  ivy-cache:
  spark-checkpoints:
